<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <!-- University background overlay -->
  <div class="bg-overlay"></div>

  <div class="container">
    <div class="form-card">

      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
      </div>

      <h1>Create Account</h1>
      <p class="subtitle">Fill in your details to register</p>

      <form action="#" method="POST" novalidate id="signupForm">

        <!-- Full Name -->
        <div class="input-group">
          <label for="fullname">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/>
            </svg>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Enter your full name"
              required
            />
          </div>
        </div>

        <!-- Roll Number -->
        <div class="input-group">
          <label for="rollno">Roll Number</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1h-2zm3 18H5V8h14v11z"/>
            </svg>
            <input
              type="text"
              id="rollno"
              name="rollno"
              placeholder="e.g. 2024-CS-001"
              required
            />
          </div>
        </div>

        <!-- University / School Name -->
        <div class="input-group">
          <label for="institution">University / School Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
            <input
              type="text"
              id="institution"
              name="institution"
              placeholder="e.g. University of the Punjab"
              required
            />
          </div>
        </div>

        <!-- Class Name -->
        <div class="input-group">
          <label for="classname">Class / Program</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM9 4h6v2H9V4zm9 16H6V8h12v12z"/>
            </svg>
            <input
              type="text"
              id="classname"
              name="classname"
              placeholder="e.g. BS Computer Science – Semester 4"
              required
            />
          </div>
        </div>

        <!-- Postal Address -->
        <div class="input-group">
          <label for="postal">Postal Address</label>
          <div class="input-wrapper textarea-wrapper">
            <svg class="input-icon icon-top" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <textarea
              id="postal"
              name="postal"
              rows="2"
              placeholder="House #, Street, City, Postal Code"
              required
            ></textarea>
          </div>
        </div>

        <!-- Current Address -->
        <div class="input-group">
          <label for="current_address">Current Address</label>
          <div class="input-wrapper textarea-wrapper">
            <svg class="input-icon icon-top" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
            </svg>
            <textarea
              id="current_address"
              name="current_address"
              rows="2"
              placeholder="Current living address (if different)"
              required
            ></textarea>
          </div>
        </div>

        <!-- Mobile Number -->
        <div class="input-group">
          <label for="mobile">Mobile Number</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.47 11.47 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.24 1.01l-2.21 2.2z"/>
            </svg>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="e.g. 0300-1234567"
              pattern="[0-9\-\+\s]{10,15}"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/>
            </svg>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
          </div>
          <p class="error-msg" id="pass-error"></p>
        </div>

        <button type="submit" class="btn-signup">Create Account</button>

      </form>

      <p class="signin-text">Already have an account? <a href="index.html">Sign In</a></p>

    </div>
  </div>

  <script>
    // Toggle password visibility
    const toggleBtn = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.setAttribute('aria-pressed', String(isPassword));
    });

    // Confirm password check
    const form = document.getElementById('signupForm');
    const confirmInput = document.getElementById('confirm_password');
    const passError = document.getElementById('pass-error');

    form.addEventListener('submit', (e) => {
      if (passwordInput.value !== confirmInput.value) {
        e.preventDefault();
        passError.textContent = 'Passwords do not match.';
        confirmInput.focus();
      } else {
        passError.textContent = '';
      }
    });
  </script>

</body>
</html>
